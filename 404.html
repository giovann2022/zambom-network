<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Zambom Network</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; padding:20px; }
    .err { max-width:520px; }
    .err h1 { font-size: clamp(60px, 12vw, 120px); margin:0; background:linear-gradient(135deg,#3ba0f7,#00c97a); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .err h2 { font-size: clamp(20px, 4vw, 28px); margin:10px 0 16px; }
    .err p { color:#96bdd8; margin-bottom:28px; }
    .err a { display:inline-block; padding:14px 28px; background:linear-gradient(135deg,#1a6fc4,#00c97a); color:#fff; text-decoration:none; border-radius:8px; font-weight:600; }
  </style>
</head>
<body>
  <div class="err">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que você procurou não existe ou foi movida.</p>
    <a href="/">← Voltar para o início</a>
  </div>
</body>
</html>
